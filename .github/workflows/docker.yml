name: Docker image

# Railway と同じ手順（Dockerfile のビルド → 環境変数の確認 → migrate → 起動）を、MySQL 8 と一緒に CI で確認する。
# Railway にデプロイする前に、イメージのビルド失敗・起動スクリプトの失敗・設定ファイルの食い違いに気づくため。
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/docker.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  image:
    name: Build image, start web + worker with MySQL, run smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image (backend/Dockerfile)
        run: docker build -t courtq-api backend

      - name: Start MySQL 8
        run: |
          docker network create courtq-net
          docker run -d --name mysql --network courtq-net \
            -e MYSQL_ROOT_PASSWORD=ci-only-password -e MYSQL_DATABASE=railway mysql:8.0
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -pci-only-password --silent && exit 0
            sleep 2
          done
          echo "MySQL が起動しませんでした"; docker logs mysql; exit 1

      - name: Start web (the same start script as Railway)
        run: |
          KEY=$(docker run --rm courtq-api php artisan key:generate --show)
          cat > ci.env <<EOF2
          PORT=8080
          APP_KEY=${KEY}
          APP_URL=https://courtq-api.example.test
          APP_FRONTEND_URL=https://courtq.example.test
          CORS_ALLOWED_ORIGINS=https://courtq.example.test
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=railway
          DB_USERNAME=root
          DB_PASSWORD=ci-only-password
          CACHE_DRIVER=database
          QUEUE_CONNECTION=database
          SEED_DEMO=true
          EOF2
          # heredoc のインデントを除く
          sed -i 's/^ *//' ci.env
          docker run -d --name web --network courtq-net -p 8080:8080 --env-file ci.env courtq-api

      - name: Wait for the health check (database ok)
        run: |
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/api/health
          echo

      - name: Start worker (the start command of railway.worker.json)
        run: |
          CMD=$(jq -r '.deploy.startCommand' backend/railway.worker.json)
          docker run -d --name worker --network courtq-net --env-file ci.env courtq-api sh -c "$CMD"
          sleep 15
          test "$(docker inspect -f '{{.State.Running}}' worker)" = "true" || { docker logs worker; exit 1; }
          docker logs worker 2>&1 | grep -q '設定の確認: 問題はありません'

      - name: Smoke test
        run: bash scripts/smoke-test.sh http://127.0.0.1:8080/api

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- web"; docker logs web 2>&1 | tail -80 || true
          echo "--- worker"; docker logs worker 2>&1 | tail -40 || true
          echo "--- mysql"; docker logs mysql 2>&1 | tail -20 || true
